<svg width="220" height="200" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231a3e"/>
      <stop offset="1" stop-color="#110d1c"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3a6e8"/>
      <stop offset="1" stop-color="#4dd4be"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9168c9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4dd4be" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a982db" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a982db" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="220" height="200" rx="16" fill="url(#bg)"/>

  <!-- Glow center -->
  <ellipse cx="110" cy="95" rx="80" ry="70" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="110" cy="95" r="64" fill="none" stroke="url(#ring)" stroke-width="1.2"/>

  <!-- Inner ring -->
  <circle cx="110" cy="95" r="44" fill="none" stroke="#a982db" stroke-width="0.7" stroke-opacity="0.35"/>

  <!-- Gear teeth (12 teeth) -->
  <g fill="url(#gear)" opacity="0.85">
    <rect x="107" y="24" width="6" height="14" rx="2"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(30 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(60 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(90 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(120 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(150 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(180 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(210 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(240 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(270 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(300 110 95)"/>
    <rect x="107" y="24" width="6" height="14" rx="2" transform="rotate(330 110 95)"/>
  </g>

  <!-- Gear body -->
  <circle cx="110" cy="95" r="40" fill="#1b1430" stroke="url(#gear)" stroke-width="1.5"/>

  <!-- Inner star / sparkle -->
  <path d="M110 72 L113.5 88 L129 90 L116.5 101 L120 116 L110 108 L100 116 L103.5 101 L91 90 L106.5 88 Z"
        fill="url(#gear)" opacity="0.9"/>

  <!-- Center dot -->
  <circle cx="110" cy="95" r="6" fill="#110d1c"/>
  <circle cx="110" cy="95" r="3.5" fill="url(#gear)"/>

  <!-- Scattered stars -->
  <g fill="#c3a6e8" opacity="0.7">
    <circle cx="32" cy="30" r="1.5"/>
    <circle cx="48" cy="18" r="1"/>
    <circle cx="22" cy="55" r="1"/>
    <circle cx="185" cy="25" r="1.5"/>
    <circle cx="196" cy="44" r="1"/>
    <circle cx="176" cy="15" r="1"/>
    <circle cx="28" cy="150" r="1.5"/>
    <circle cx="14" cy="130" r="1"/>
    <circle cx="190" cy="155" r="1.5"/>
    <circle cx="200" cy="135" r="1"/>
    <circle cx="60" cy="170" r="1"/>
    <circle cx="160" cy="175" r="1"/>
  </g>
  <g fill="#4dd4be" opacity="0.5">
    <circle cx="40" cy="75" r="1"/>
    <circle cx="175" cy="70" r="1"/>
    <circle cx="55" cy="140" r="1.5"/>
    <circle cx="170" cy="140" r="1"/>
  </g>

  <!-- Diamond accents -->
  <path d="M36 100 L40 95 L44 100 L40 105 Z" fill="#a982db" opacity="0.5"/>
  <path d="M176 100 L180 95 L184 100 L180 105 Z" fill="#4dd4be" opacity="0.4"/>
  <path d="M110 12 L113 8 L116 12 L113 16 Z" fill="#c3a6e8" opacity="0.6"/>

  <!-- Bottom label -->
  <rect x="0" y="170" width="220" height="30" rx="0" fill="url(#bg)" opacity="0.9"/>
  <text x="110" y="188" text-anchor="middle" font-family="Inter, sans-serif" font-size="11"
        font-weight="600" letter-spacing="2" fill="#a982db" opacity="0.85">HERTA SCHEDULE</text>
</svg>
